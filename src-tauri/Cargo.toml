[package]
name = "auracap"
version = "0.1.3"
description = "AI-ready screen capture tool for Windows"
authors = ["katoiek"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "auracap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
# Windowsログオン時の自動起動（レジストリRunキー管理） / Auto-launch at login (registry Run key)
tauri-plugin-autostart = "2"
xcap = "0.9.6"
arboard = "3.6.1"
chrono = "0.4.45"
# ブラウザ拡張からのフルページキャプチャ受信用（ローカルHTTPブリッジ）
# Local HTTP bridge that receives full-page captures from the browser extension
tiny_http = "0.12"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    # 録画：選択モニターをHMONITORで特定する / Recording: resolve the selected monitor via HMONITOR
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    # Smart Redact用（Windows標準OCR） / For Smart Redact (built-in Windows OCR)
    "Win32_System_WinRT",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
] }
# Smart Redactの機密パターン検出 / Sensitive-pattern matching for Smart Redact
regex = "1"
tauri-plugin-dialog = "2"
windows-capture = "2.0.0"

# 画像エンコード等の依存クレートはデバッグビルドでも最適化する（キャプチャ速度に直結）
# Optimize dependency crates even in debug builds (directly affects capture speed)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

