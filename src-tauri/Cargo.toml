[package]
name = "auracap"
version = "0.1.0"
description = "AI-ready screen capture tool for Windows"
authors = ["katoiek"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "auracap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
xcap = "0.9.6"
arboard = "3.6.1"
chrono = "0.4.45"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading"] }
tauri-plugin-dialog = "2"

# 画像エンコード等の依存クレートはデバッグビルドでも最適化する（キャプチャ速度に直結）
# Optimize dependency crates even in debug builds (directly affects capture speed)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

