[package]
name = "auracap"
version = "1.0.1"
description = "AI-ready screen capture tool for Windows and macOS"
authors = ["katoiek"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "auracap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
# 多重起動の防止：常駐中に再起動したら既存インスタンスを使い回す
# Single-instance guard: reuse the resident instance instead of spawning another
tauri-plugin-single-instance = "2"
# Windowsログオン時の自動起動（レジストリRunキー管理） / Auto-launch at login (registry Run key)
tauri-plugin-autostart = "2"
xcap = "0.9.6"
# xcapの`image`依存はPNGのみ有効化されているため、フリーズフレーム表示用のBMPエンコードに必要な機能を明示的に追加
# xcap's `image` dependency only enables PNG; explicitly add the feature needed for BMP-encoding the frozen frame
image = { version = "0.25", default-features = false, features = ["bmp"] }
arboard = "3.6.1"
chrono = "0.4.45"
# ブラウザ拡張からのフルページキャプチャ受信用（ローカルHTTPブリッジ）
# Local HTTP bridge that receives full-page captures from the browser extension
tiny_http = "0.12"
tauri-plugin-dialog = "2"
# Ollamaとの通信をRust側で行う（WebViewのfetchはCORSで弾かれるため） / HTTP client for Ollama (WebView fetch is blocked by CORS)
reqwest = { version = "0.12", features = ["json"] }

# Windows専用（録画・テキスト抽出・ウィンドウ列挙） / Windows-only (recording, text extraction, window enumeration)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    # 録画：選択モニターをHMONITORで特定する / Recording: resolve the selected monitor via HMONITOR
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    # テキスト抽出用（Windows標準OCR） / For text extraction (built-in Windows OCR)
    "Win32_System_WinRT",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
] }
windows-capture = "2.0.0"

# macOS専用（カーソル位置取得・録画） / macOS-only (cursor position, recording)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
# 録画：ScreenCaptureKitのSCRecordingOutputでMP4へ直接ハードウェアエンコードする（macOS 15+）
# Recording: hardware-encodes straight to MP4 via ScreenCaptureKit's SCRecordingOutput (macOS 15+)
screencapturekit = { version = "8.0.0", features = ["macos_15_0"] }

# 画像エンコード等の依存クレートはデバッグビルドでも最適化する（キャプチャ速度に直結）
# Optimize dependency crates even in debug builds (directly affects capture speed)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

